[project]
name = "rdana-backend"
version = "0.1.0"
description = "FastAPI authentication backend for the RDANA web app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "PyJWT>=2.9,<3",
  "bcrypt>=4.2,<5",
  "pydantic-settings>=2.5,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
